openapi: 3.1.0
info:
  title: MELA DESK API
  version: 1.0.0
  description: Versioned MELA DESK support-ticket API. The legacy /api prefix returns the same DTOs for the existing frontend.
servers:
  - url: http://localhost:4000/api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Tickets
  - name: Comments
  - name: Attachments
  - name: Users
  - name: Teams
  - name: Notifications
  - name: Reports
  - name: Admin
paths:
  /health:
    get:
      tags: [Admin]
      security: []
      responses:
        "200": { description: Process health; returns no sensitive configuration. }
  /ready:
    get:
      tags: [Admin]
      security: []
      responses:
        "200": { description: Database readiness. }
        "503": { description: Essential dependency unavailable. }
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      responses:
        "200":
          description: CSRF token and non-HttpOnly CSRF cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: { token: { type: string } }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201": { description: Requester created; an HTTP-only session cookie is set. }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        "200": { description: Authenticated user DTO; an HTTP-only session cookie is set. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Session revoked and cookie cleared. }
  /auth/me:
    get:
      tags: [Auth]
      responses:
        "200": { description: Current user DTO. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "202": { description: Generic accepted response; does not disclose account existence. }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8, maxLength: 128 } } }
      responses:
        "204": { description: Password updated; prior sessions revoked. }
  /tickets:
    get:
      tags: [Tickets]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TicketStatus" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string } }
        - { name: assignedAgentId, in: query, schema: { type: string, format: uuid } }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, updatedAt, priority] } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { description: Ticket DTO page constrained to the authenticated user's permissions. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, description, categoryId]
              properties:
                subject: { type: string, minLength: 10, maxLength: 240 }
                description: { type: string, minLength: 20, maxLength: 20000 }
                categoryId: { type: string, format: uuid }
                priority: { $ref: "#/components/schemas/Priority" }
                service: { type: string, maxLength: 120 }
                attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        "201": { description: Created ticket DTO. }
        "422": { $ref: "#/components/responses/Validation" }
  /tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/UuidPath"
    get:
      tags: [Tickets]
      responses:
        "200": { description: Ticket detail. Internal notes are excluded for requesters. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                subject: { type: string, minLength: 10, maxLength: 240 }
                description: { type: string, minLength: 20, maxLength: 20000 }
                categoryId: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated ticket detail. }
        "409": { $ref: "#/components/responses/Conflict" }
  /tickets/{id}/assign:
    post:
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { agentId: { type: string, format: uuid }, teamId: { type: string }, reason: { type: string, maxLength: 500 } } }
      responses:
        "200": { description: Updated assignment and ticket DTO. }
  /tickets/{id}/status:
    post:
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [status], properties: { status: { $ref: "#/components/schemas/TicketStatus" }, reason: { type: string, maxLength: 500 }, version: { type: integer, minimum: 1 } } }
      responses:
        "200": { description: Updated ticket DTO. }
        "409": { $ref: "#/components/responses/Conflict" }
  /tickets/{id}/resolve:
    post:
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [summary, code], properties: { summary: { type: string, minLength: 1 }, code: { type: string, minLength: 1, maxLength: 80 }, rootCause: { type: string }, correctiveAction: { type: string }, preventiveAction: { type: string }, publicExplanation: { type: string } } }
      responses:
        "200": { description: Resolved ticket DTO. }
  /tickets/{id}/comments:
    get:
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      responses:
        "200": { description: Public comments for requesters; public and internal comments for authorized staff. }
    post:
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 20000 }, attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } } } }
      responses:
        "201": { description: Created public comment. }
  /tickets/{id}/replies:
    post:
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "201": { description: Existing frontend alias for a public comment. }
  /tickets/{id}/notes:
    post:
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "201": { description: Staff-only internal note; inaccessible to requesters. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /attachments:
    post:
      tags: [Attachments]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: Staged private attachment metadata. }
        "413": { description: Upload exceeds the configured size limit. }
  /notifications:
    get:
      tags: [Notifications]
      responses:
        "200": { description: Authenticated user's notifications. }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Notification marked as read. }
  /reports/summary:
    get:
      tags: [Reports]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200": { description: Permission-scoped report summary matching the current frontend DTO. }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mela_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    UuidPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, PENDING_REQUESTER, PENDING_THIRD_PARTY, RESOLVED, CLOSED]
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    ApiError:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: {} }
            requestId: { type: string }
  responses:
    Unauthorized:
      description: Authentication is required or the credentials are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: The authenticated user lacks permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found or not accessible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Resource state or idempotency conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Validation:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
